<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>八方菜单管理</title><style>body{font-family:Arial,'Microsoft YaHei',sans-serif;background:#fff8ec;color:#301b12;margin:0}header{background:#29140e;color:white;padding:20px}main{max-width:980px;margin:auto;padding:20px}button{cursor:pointer;background:#a92319;color:white;border:0;padding:10px 14px;border-radius:7px}button.secondary{background:#6e5b4d}input{padding:10px;border:1px solid #cbbbad;border-radius:6px;max-width:100%;box-sizing:border-box}section,.item{background:white;border:1px solid #e7d6c6;padding:14px;border-radius:12px;margin:14px 0}.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:9px;margin:12px 0}.fields label{display:flex;flex-direction:column;gap:5px;font-size:13px}.actions{display:flex;flex-wrap:wrap;gap:8px}h2{margin-bottom:4px}.item{background:#fffaf5}img{width:110px;height:80px;object-fit:cover;border-radius:8px}#status{font-weight:bold;padding:10px 0}.hint{color:#68594c;font-size:14px}</style></head><body><header><h1>八方 BAFANG · 菜单管理后台</h1></header><main><div id="login"><p>输入你在 Cloudflare 设置的管理员密码。密码只用于本次打开的页面，不会保存在浏览器。</p><input type="password" id="pwd" placeholder="管理员密码"><button id="enter">进入后台</button></div><div id="editor" hidden><p class="hint">修改后点击「保存并发布」。图片建议小于 200 KB；修改后约数秒至数分钟内可见。</p><div class="actions"><button id="save">保存并发布</button><button id="addcat" class="secondary">+ 添加分类</button><button id="reset" class="secondary">恢复初始菜单（尚未保存）</button><a href="/" target="_blank">查看官网</a></div><p id="status"></p><div id="categories"></div></div></main><script>
let password='',data={categories:[]};const $=id=>document.getElementById(id);const fields=(obj,defs)=>{let wrap=document.createElement('div');wrap.className='fields';for(const [key,label] of defs){let l=document.createElement('label');l.textContent=label;let inp=document.createElement('input');inp.value=obj[key]||'';inp.oninput=()=>obj[key]=inp.value;l.append(inp);wrap.append(l)}return wrap};const btn=(txt,fn,cls='secondary')=>{let b=document.createElement('button');b.textContent=txt;b.className=cls;b.onclick=fn;return b};
function render(){const root=$('categories');root.replaceChildren();data.categories.forEach((cat,ci)=>{let sec=document.createElement('section');let h=document.createElement('h2');h.textContent=`${ci+1}. ${cat.zh||'新分类'}`;sec.append(h);sec.append(fields(cat,[['zh','分类中文'],['en','Category English'],['descZh','中文描述'],['descEn','English description']]));let act=document.createElement('div');act.className='actions';act.append(btn('↑ 上移',()=>{if(ci){[data.categories[ci-1],data.categories[ci]]=[cat,data.categories[ci-1]];render()}}),btn('↓ 下移',()=>{if(ci<data.categories.length-1){[data.categories[ci+1],data.categories[ci]]=[cat,data.categories[ci+1]];render()}}),btn('删除分类',()=>{if(confirm('删除整个分类？')){data.categories.splice(ci,1);render()}}));sec.append(act);
cat.items.forEach((item,ii)=>{let block=document.createElement('div');block.className='item';block.append(fields(item,[['zh','菜名中文'],['en','English name'],['price','价格及单位（如 $3.50 / pc）']]));let buttons=document.createElement('div');buttons.className='actions';let file=document.createElement('input');file.type='file';file.accept='image/png,image/jpeg,image/webp';file.onchange=async()=>{let f=file.files[0];if(!f)return;if(f.size>230000){alert('图片超过 230KB，请先压缩再上传');return}item.image=await new Promise((resolve,reject)=>{let r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(f)});render()};buttons.append(file);if(item.image){let img=document.createElement('img');img.src=item.image;buttons.append(img);buttons.append(btn('删除图片',()=>{item.image='';render()}))}buttons.append(btn('删除菜品',()=>{cat.items.splice(ii,1);render()}));block.append(buttons);sec.append(block)});sec.append(btn('+ 添加菜品',()=>{cat.items.push({zh:'',en:'',price:'',image:''});render()}));root.append(sec)})}
$('enter').onclick=async()=>{password=$('pwd').value;if(!password)return;let r=await fetch('/api/menu');if(!r.ok){alert('请先配置 Cloudflare KV');return}data=await r.json();if(!data.categories?.length){data=await (await fetch('/menu-default.json')).json()}$('login').hidden=true;$('editor').hidden=false;render()};$('addcat').onclick=()=>{data.categories.push({zh:'',en:'',descZh:'',descEn:'',items:[]});render()};$('reset').onclick=async()=>{if(confirm('恢复最初菜单？需要再点保存才会发布')){data=await(await fetch('/menu-default.json')).json();render()}};
$('save').onclick=async()=>{const s=$('status');s.textContent='正在保存...';try{let r=await fetch('/api/menu',{method:'PUT',headers:{'content-type':'application/json','Authorization':'Bearer '+password},body:JSON.stringify(data)});let j=await r.json();s.textContent=r.ok?'保存成功！网站菜单已发布。':'保存失败：'+(j.error||r.status)}catch(e){s.textContent='网络错误：'+e.message}};
</script></body></html>
